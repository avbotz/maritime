# SPDX-License-Identifier: Apache-2.0

description: PWM-driven servo motor.

compatible: "avbotz,pwm-servo"

include: base.yaml

properties:
  pwms:
    required: true
    type: phandle-array
    description: PWM specifier driving the servo motor.

  min-pulse:
    required: true
    type: int
    description: Minimum pulse width (nanoseconds).

  mid-pulse:
    required: false
    type: int
    description: Middle pulse width (nanoseconds).

  max-pulse:
    required: true
    type: int
    description: Maximum pulse width (nanoseconds).