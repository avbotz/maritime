name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      # Checked out as maritime, next to zephyr, the same layout as a local workspace
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: maritime

      - name: Read Zephyr revision
        id: zephyr
        run: echo "revision=$(yq '.manifest.projects[] | select(.name == "zephyr") | .revision' maritime/west.yml)" >> "$GITHUB_OUTPUT"

      # format.sh only needs checkpatch and dts-linter from Zephyr, not the whole tree
      - name: Checkout Zephyr scripts
        uses: actions/checkout@v7
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ steps.zephyr.outputs.revision }}
          path: zephyr
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: zephyr/scripts/ci/package-lock.json

      # clang-format output differs between versions, so pin one rather than use the runner's
      - name: Install formatters
        run: |
          pip install clang-format==23.1.3
          npm --prefix zephyr/scripts/ci ci

      - name: Check formatting
        run: maritime/format.sh --check

  build:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: maritime

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Restored before west update, which then only has to check out the pinned revisions
      - name: Cache west modules
        uses: actions/cache@v6
        with:
          path: |
            zephyr
            modules
          key: west-modules-${{ hashFiles('maritime/west.yml') }}

      # Runs west init and update, and caches pip downloads, the Zephyr SDK and ccache
      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: maritime
          toolchains: arm-zephyr-eabi

      - name: Build
        working-directory: maritime
        run: west build -b rpi_pico

      - name: Upload UF2
        uses: actions/upload-artifact@v7
        with:
          name: maritime-rpi_pico
          path: maritime/build/zephyr/zephyr.uf2
          if-no-files-found: error
