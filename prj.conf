CONFIG_BOOT_BANNER=n

CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# Resets the board (stopping the thruster PWM) if the main loop stalls
CONFIG_WATCHDOG=y

# Framing for the protocol to thalassic
CONFIG_COBS=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Maritime"

# Console shares the USB link with the protocol to thalassic. debug.conf turns logging on for bench debugging.
CONFIG_LOG=n

# Enable FLTO
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
