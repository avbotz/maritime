CONFIG_BOOT_BANNER=n

CONFIG_POLL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y

# Resets the board (stopping the thruster PWM) if the main loop stalls
CONFIG_WATCHDOG=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Maritime"

# The console is the protocol to thalassic, so nothing else may print to it: a log
# line landing in the middle of a protocol line would corrupt it. debug.conf turns
# logging on for bench debugging.
CONFIG_LOG=n
