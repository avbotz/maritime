# Logs go to the same USB console as the protocol. Only use for debugging.
CONFIG_LOG=y
# needed so there is not a huge delay with printk
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
# USB is the output of logs, so turning on logs of USB would be recursive
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# Disable FLTO
CONFIG_LTO=n
CONFIG_ISR_TABLES_LOCAL_DECLARATION=n
